<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SysRealm — 3D Cybernetic Account Registration</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --card-tilt-x: 0deg;
            --card-tilt-y: 0deg;
            --sheen-x: 50%;
            --sheen-y: 50%;
            --accent-glow: rgba(139, 92, 246, 0.5);
            --accent-color: #8b5cf6;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background: #030712;
            color: #f8fafc;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            perspective: 1400px;
            transform-style: preserve-3d;
            padding: 24px;
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.22;
            pointer-events: none;
            animation: orbFloat 14s ease-in-out infinite alternate;
        }
        .o1 { width: 480px; height: 480px; background: #8b5cf6; top: -120px; left: -100px; }
        .o2 { width: 420px; height: 420px; background: #3b82f6; bottom: -100px; right: -80px; animation-delay: -6s; }
        @keyframes orbFloat {
            0% { transform: translate3d(0, 0, -200px) scale(0.9); }
            100% { transform: translate3d(40px, -30px, 0) scale(1.15); }
        }

        #os-3d-canvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        .card-3d-wrapper {
            position: relative;
            z-index: 20;
            width: 100%;
            max-width: 480px;
            perspective: 1200px;
            transform-style: preserve-3d;
        }

        .card {
            position: relative;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(28px);
            border: 1.5px solid rgba(139, 92, 246, 0.35);
            border-radius: 26px;
            padding: 38px 36px;
            width: 100%;
            box-shadow: 
                0 35px 85px rgba(0, 0, 0, 0.75),
                0 0 50px var(--accent-glow),
                inset 0 1px 0 rgba(255, 255, 255, 0.25),
                inset 0 0 35px rgba(139, 92, 246, 0.08);
            transform-style: preserve-3d;
            transform: rotateX(var(--card-tilt-x)) rotateY(var(--card-tilt-y)) translateZ(30px);
            transition: transform 0.12s ease-out, border-color 0.4s, box-shadow 0.4s;
        }

        .card-sheen {
            position: absolute;
            inset: 0;
            border-radius: 26px;
            pointer-events: none;
            background: radial-gradient(circle 380px at var(--sheen-x) var(--sheen-y), rgba(255, 255, 255, 0.22), transparent 70%);
            z-index: 1;
            mix-blend-mode: overlay;
        }

        .bi-3d-wrap {
            position: relative;
            width: 72px;
            height: 72px;
            margin: 0 auto 12px;
            perspective: 600px;
            transform-style: preserve-3d;
            transform: translateZ(55px);
        }
        .bi {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #8b5cf6, #3b82f6);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: #fff;
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.65);
            transform-style: preserve-3d;
        }
        .bi-ring {
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            pointer-events: none;
            border: 2px dashed rgba(168, 85, 247, 0.75);
            filter: drop-shadow(0 0 8px #c084fc);
        }
        .bi-ring-1 { animation: gyroRotate1 6s linear infinite; }
        .bi-ring-2 { border-color: rgba(56, 189, 248, 0.7); animation: gyroRotate2 8s linear infinite reverse; }
        @keyframes gyroRotate1 {
            0% { transform: rotateX(68deg) rotateY(15deg) rotateZ(0deg); }
            100% { transform: rotateX(68deg) rotateY(15deg) rotateZ(360deg); }
        }
        @keyframes gyroRotate2 {
            0% { transform: rotateX(-55deg) rotateY(42deg) rotateZ(0deg); }
            100% { transform: rotateX(-55deg) rotateY(42deg) rotateZ(360deg); }
        }

        .brand { text-align: center; margin-bottom: 20px; }
        .bn {
            font-size: 25px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h2 { font-size: 19px; color: #f8fafc; text-align: center; margin-bottom: 4px; }
        .sub { text-align: center; color: #64748b; font-size: 13px; margin-bottom: 18px; }

        .role-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; position: relative; z-index: 10; }
        .role-card {
            border: 2px solid rgba(71, 85, 105, 0.45);
            border-radius: 14px;
            padding: 14px 10px;
            text-align: center;
            cursor: pointer;
            background: rgba(30, 41, 59, 0.65);
            user-select: none;
            position: relative;
            z-index: 10;
            transition: all 0.22s ease-out;
        }
        .role-card:hover { transform: translateY(-2px) scale(1.02); border-color: rgba(139, 92, 246, 0.6); }
        .role-card.sel-teacher { border-color: #3b82f6; background: rgba(59, 130, 246, 0.18); box-shadow: 0 0 20px rgba(59, 130, 246, 0.35); }
        .role-card.sel-student { border-color: #8b5cf6; background: rgba(139, 92, 246, 0.18); box-shadow: 0 0 20px rgba(139, 92, 246, 0.35); }
        .ri { font-size: 26px; margin-bottom: 4px; display: inline-block; }
        .rl { font-size: 13px; font-weight: 700; color: #f1f5f9; }
        .rd { font-size: 10px; color: #94a3b8; margin-top: 2px; }

        .error-box {
            background: rgba(239, 68, 68, 0.16);
            border: 1px solid rgba(239, 68, 68, 0.5);
            border-radius: 10px;
            padding: 10px 14px;
            margin-bottom: 16px;
            color: #fca5a5;
            font-size: 12.5px;
            display: flex;
            gap: 8px;
            align-items: center;
            position: relative;
            z-index: 10;
        }

        form {
            position: relative;
            z-index: 10;
        }

        .form-group { margin-bottom: 13px; position: relative; z-index: 10; }
        label { display: block; font-size: 12px; color: #cbd5e1; margin-bottom: 5px; font-weight: 600; }
        .iw { position: relative; }
        .iw i.icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: #64748b; font-size: 13px; z-index: 2; pointer-events: none; }
        input[type=text], input[type=email], input[type=password] {
            width: 100%;
            padding: 10px 14px 10px 38px;
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(71, 85, 105, 0.6);
            border-radius: 10px;
            color: #f8fafc;
            font-size: 13.5px;
            outline: none;
            transition: all 0.2s;
            position: relative;
            z-index: 1;
            cursor: text;
            pointer-events: auto;
        }
        input:focus { border-color: #8b5cf6; background: rgba(30, 41, 59, 0.98); box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.25); }
        input::placeholder { color: #64748b; }
        .hint { font-size: 11px; color: #64748b; margin-top: 4px; }

        .sb { height: 4px; border-radius: 4px; margin-top: 5px; background: #1e293b; overflow: hidden; }
        .sf { height: 100%; width: 0; transition: width .3s, background .3s; border-radius: 4px; }
        .sl { font-size: 11px; margin-top: 3px; }

        .btn-reg {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 11px;
            color: #fff;
            font-size: 14.5px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 6px;
            position: relative;
            z-index: 2;
            pointer-events: auto;
            box-shadow: 0 10px 25px rgba(139, 92, 246, 0.45);
            transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-reg:hover { transform: translateY(-2px) scale(1.01); box-shadow: 0 16px 35px rgba(139, 92, 246, 0.65); }
        .btn-reg:active { transform: translateY(1px); }
        .btn-teacher { background: linear-gradient(135deg, #3b82f6, #0ea5e9); }
        .btn-student { background: linear-gradient(135deg, #8b5cf6, #6366f1); }

        .divider { display: flex; align-items: center; gap: 12px; margin: 16px 0; color: #475569; font-size: 12px; position: relative; z-index: 10; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: rgba(71, 85, 105, 0.5); }
        .login-link { text-align: center; font-size: 13px; color: #94a3b8; position: relative; z-index: 10; }
        .login-link a { color: #8b5cf6; text-decoration: none; font-weight: 600; }
        .login-link a:hover { color: #a78bfa; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="orb o1"></div>
    <div class="orb o2"></div>

    <canvas id="os-3d-canvas"></canvas>

    <div class="card-3d-wrapper" id="card-wrapper">
        <div class="card" id="main-card">
            <div class="card-sheen"></div>

            <div class="brand">
                <div class="bi-3d-wrap">
                    <div class="bi"><i class="fas fa-microchip"></i></div>
                    <div class="bi-ring bi-ring-1"></div>
                    <div class="bi-ring bi-ring-2"></div>
                </div>
                <div class="bn">SysRealm</div>
            </div>

            <h2>Student Registration</h2>
            <p class="sub">Register your student account to join the OS &amp; DBMS Lab</p>

            <div style="background: rgba(30, 41, 59, 0.65); border: 1px solid rgba(139, 92, 246, 0.35); border-radius: 14px; padding: 12px 14px; margin-bottom: 18px; display: flex; align-items: center; gap: 12px; position: relative; z-index: 10;">
                <div style="font-size: 26px;">👨‍🎓</div>
                <div>
                    <div style="font-size: 13px; font-weight: 700; color: #f1f5f9;">Student Lab Access</div>
                    <div style="font-size: 11px; color: #94a3b8; margin-top: 2px;">Faculty &amp; Teacher accounts are provisioned administratively.</div>
                </div>
            </div>

            {% if error %}
            <div class="error-box"><i class="fas fa-exclamation-circle"></i> {{ error }}</div>
            {% endif %}

            <form method="POST" action="/register" onsubmit="return validateForm()">
                <input type="hidden" name="account_type" id="account-type-input" value="student">

                <div class="form-group">
                    <label>Full Name</label>
                    <div class="iw">
                        <i class="fas fa-user icon"></i>
                        <input type="text" name="name" placeholder="Your name"
                               value="{{ request.form.get('name','') }}" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <div class="iw">
                        <i class="fas fa-envelope icon"></i>
                        <input type="email" name="email" placeholder="you@example.com"
                               value="{{ request.form.get('email','') }}" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="iw">
                        <i class="fas fa-lock icon"></i>
                        <input type="password" id="pw" name="password"
                               placeholder="Min 6 characters" required
                               oninput="checkStrength(this.value)">
                    </div>
                    <div class="sb"><div class="sf" id="sw"></div></div>
                    <div class="sl" id="sl"></div>
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <div class="iw">
                        <i class="fas fa-lock icon"></i>
                        <input type="password" id="pw2" name="confirm"
                               placeholder="Repeat password" required>
                    </div>
                    <div class="hint" id="mh"></div>
                </div>

                <button type="submit" class="btn-reg btn-student" id="btn-reg">
                    <i class="fas fa-user-plus" style="margin-right:8px;"></i>
                    <span id="btn-lbl">Register as Student</span>
                </button>
            </form>

            <div class="divider">or</div>
            <div class="login-link">Already have an account? <a href="/login">&larr; Sign in</a></div>
        </div>
    </div>

    <script>
        // Clear old tab token & student progress cache so new account starts fresh
        sessionStorage.removeItem('sysrealm_tab_token');
        sessionStorage.removeItem('sysrealm_quests');
        sessionStorage.removeItem('sysrealm_student_xp');
        localStorage.removeItem('sysrealm_quests');
        localStorage.removeItem('sysrealm_student_xp');

        var selRole = 'student';

        function selectRole(role) {
            selRole = role;
            document.getElementById('account-type-input').value = role;
            document.getElementById('card-teacher').className = 'role-card' + (role==='teacher' ? ' sel-teacher' : '');
            document.getElementById('card-student').className = 'role-card' + (role==='student' ? ' sel-student' : '');
            var btn = document.getElementById('btn-reg');
            var lbl = document.getElementById('btn-lbl');
            var root = document.documentElement;
            if (role === 'teacher') {
                btn.className = 'btn-reg btn-teacher';
                lbl.textContent = 'Register as Teacher';
                root.style.setProperty('--accent-glow', 'rgba(59, 130, 246, 0.5)');
            } else {
                btn.className = 'btn-reg btn-student';
                lbl.textContent = 'Register as Student';
                root.style.setProperty('--accent-glow', 'rgba(139, 92, 246, 0.5)');
            }
        }

        function checkStrength(pw) {
            var bar=document.getElementById('sw'),lbl=document.getElementById('sl'),sc=0;
            if(pw.length>=6)sc++;if(pw.length>=10)sc++;
            if(/[A-Z]/.test(pw))sc++;if(/[0-9]/.test(pw))sc++;if(/[^A-Za-z0-9]/.test(pw))sc++;
            var c=['#ef4444','#f97316','#eab308','#22c55e','#22c55e'];
            var t=['Very Weak','Weak','Fair','Strong','Very Strong'];
            bar.style.width=(sc/5*100)+'%'; bar.style.background=c[sc-1]||'#ef4444';
            lbl.textContent=pw.length?(t[sc-1]||'Very Weak'):''; lbl.style.color=c[sc-1]||'#ef4444';
        }

        function updatePwMatch() {
            var p1 = document.getElementById('pw').value;
            var p2 = document.getElementById('pw2').value;
            var h = document.getElementById('mh');
            if (!p2) { h.textContent = ''; return; }
            if (p1 === p2) {
                h.textContent = '✓ Passwords match';
                h.style.color = '#22c55e';
            } else {
                h.textContent = '⚠️ Passwords do not match';
                h.style.color = '#ef4444';
            }
        }

        document.getElementById('pw').addEventListener('input', function() {
            checkStrength(this.value);
            if (document.getElementById('pw2').value) updatePwMatch();
        });

        document.getElementById('pw2').addEventListener('input', updatePwMatch);

        function validateForm() {
            var nameInp = document.querySelector('input[name="name"]');
            var emailInp = document.querySelector('input[name="email"]');
            var p1 = document.getElementById('pw').value;
            var p2 = document.getElementById('pw2').value;
            var h = document.getElementById('mh');
            var btn = document.getElementById('btn-reg');
            var lbl = document.getElementById('btn-lbl');

            if (!nameInp || !nameInp.value.trim()) {
                alert('Please enter your full name.');
                if (nameInp) nameInp.focus();
                return false;
            }
            if (!emailInp || !emailInp.value.trim() || emailInp.value.indexOf('@') === -1) {
                alert('Please enter a valid email address.');
                if (emailInp) emailInp.focus();
                return false;
            }
            if (!p1 || p1.length < 6) {
                if (h) {
                    h.textContent = '⚠️ Password must be at least 6 characters long';
                    h.style.color = '#ef4444';
                }
                document.getElementById('pw').focus();
                return false;
            }
            if (p1 !== p2) {
                if (h) {
                    h.textContent = '⚠️ Passwords do not match';
                    h.style.color = '#ef4444';
                }
                document.getElementById('pw2').focus();
                return false;
            }

            if (btn) {
                btn.style.opacity = '0.85';
                btn.style.pointerEvents = 'none';
                if (lbl) lbl.innerHTML = '<i class="fas fa-spinner fa-spin" style="margin-right:6px;"></i> Creating Account...';
            }
            return true;
        }

        // 3D Parallax Tilt
        (function() {
            var card = document.getElementById('main-card');
            var targetX = 0, targetY = 0, curX = 0, curY = 0;
            window.addEventListener('mousemove', function(e) {
                var cx = window.innerWidth / 2, cy = window.innerHeight / 2;
                targetY = ((e.clientX - cx) / cx) * 16;
                targetX = -((e.clientY - cy) / cy) * 14;
                if (card) {
                    var r = card.getBoundingClientRect();
                    document.documentElement.style.setProperty('--sheen-x', (((e.clientX - r.left)/r.width)*100).toFixed(1)+'%');
                    document.documentElement.style.setProperty('--sheen-y', (((e.clientY - r.top)/r.height)*100).toFixed(1)+'%');
                }
            });
            function loop() {
                curX += (targetX - curX) * 0.08;
                curY += (targetY - curY) * 0.08;
                document.documentElement.style.setProperty('--card-tilt-x', curX.toFixed(2) + 'deg');
                document.documentElement.style.setProperty('--card-tilt-y', curY.toFixed(2) + 'deg');
                requestAnimationFrame(loop);
            }
            loop();
        })();

        // 3D Grid Canvas
        (function() {
            var canvas = document.getElementById('os-3d-canvas');
            if (!canvas) return;
            var ctx = canvas.getContext('2d');
            var W = canvas.width = window.innerWidth, H = canvas.height = window.innerHeight;
            window.addEventListener('resize', function() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; });
            var off = 0;
            function draw() {
                ctx.clearRect(0, 0, W, H);
                var cx = W / 2, horizon = H * 0.65;
                off = (off + 1) % 32;
                ctx.save();
                ctx.strokeStyle = 'rgba(139, 92, 246, 0.12)';
                for (var l = -20; l <= 20; l++) {
                    ctx.beginPath(); ctx.moveTo(cx, horizon); ctx.lineTo(cx + l * 80, H); ctx.stroke();
                }
                for (var z = 20; z < 400; z += 24) {
                    var py = horizon + (420 / ((z + off) % 380 + 10)) * 60;
                    if (py <= H) {
                        ctx.beginPath(); ctx.moveTo(0, py); ctx.lineTo(W, py); ctx.stroke();
                    }
                }
                ctx.restore();
                requestAnimationFrame(draw);
            }
            draw();
        })();
    </script>
</body>
</html>
